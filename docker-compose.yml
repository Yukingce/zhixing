services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zhixing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: zhixing-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  init-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhixing-init-db
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/init_db.py"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhixing-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  frontend:
    image: nginx:1.27-alpine
    container_name: zhixing-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/zhixing.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: